name: Cleanup Cloudflare Pages (one-off)

# 一次性任务：删除不再使用的 Cloudflare Pages 项目。
# 需要先在仓库 Secrets 里添加 CLOUDFLARE_API_TOKEN（权限 Account → Cloudflare Pages → Edit），用完即可删除。
on:
  workflow_dispatch:
    inputs:
      projects:
        description: "要删除的 Pages 项目名，逗号分隔"
        type: string
        default: "huex-auto,huex"
      account_id:
        description: "Cloudflare 账户 ID"
        type: string
        default: "7f90b2ad9d1816ea2a65a6c932274cea"

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Delete Pages projects
        run: python3 tools/cleanup_cloudflare_pages.py
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ inputs.account_id }}
          CF_PROJECTS: ${{ inputs.projects }}

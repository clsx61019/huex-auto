name: Sync CNY/HUF rates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查不写入简道云"
        type: boolean
        default: false
      full_check:
        description: "全面检查（从 2025-01-01 起全部核对）"
        type: boolean
        default: false
  # MNB 每个工作日中午（布达佩斯时间）公布汇率。一天跑 4 次，
  # 每次核对最近 60 天并补齐，哪次没跑成或被 GitHub 延迟都没关系。
  # 每月 1 日另做一次全面检查。
  schedule:
    - cron: "23 11 * * *"
    - cron: "23 14 * * *"
    - cron: "23 17 * * *"
    - cron: "23 21 * * *"
    - cron: "47 3 1 * *"

permissions:
  contents: write

concurrency:
  group: sync-rates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync rates to Jiandaoyun
        run: python3 sync_rates.py
        env:
          JDY_API_KEY: ${{ secrets.JDY_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FULL_CHECK: ${{ (inputs.full_check || github.event.schedule == '47 3 1 * *') && '1' || '' }}

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update exchange rate"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
